[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "unify-mcp"
version = "0.1.0"
description = "Read-only MCP server for UniFi home network diagnostics via Azure Key Vault"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Logan" }]
dependencies = [
  "azure-identity>=1.19.0",
  "azure-keyvault-secrets>=4.9.0",
  "httpx>=0.28.0",
  "mcp>=2.0.0",
  "pydantic>=2.10.0",
  "pydantic-settings>=2.7.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.3.0", "pytest-asyncio>=0.25.0", "ruff>=0.9.0"]

[project.scripts]
unify-mcp = "unify_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/unify_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
